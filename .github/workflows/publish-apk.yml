name: Publish KANA POS APK

on:
  push:
    branches: [main]
    paths:
      - 'payload/*.b64'
      - '.github/workflows/publish-apk.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout update payload
        uses: actions/checkout@v4

      - name: Rebuild APK from payload
        shell: bash
        run: |
          set -euo pipefail
          cat payload/*.b64 | base64 --decode > KANA-POS-v1.14.0.apk
          test -s KANA-POS-v1.14.0.apk
          echo "$(sha256sum KANA-POS-v1.14.0.apk)"
          test "$(sha256sum KANA-POS-v1.14.0.apk | cut -d' ' -f1)" = "84d283d2951d099f052cff4d4a7c3103307d918bf18cea98ac0ae2a07b8aa19d"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.14.0
          name: KANA POS v1.14.0
          body: Versi awal mekanisme Update KANA POS.
          files: KANA-POS-v1.14.0.apk
          generate_release_notes: false
